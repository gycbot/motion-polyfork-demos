<!doctype html>

<meta name="theme-color" content="#17181a"><meta name="description" content="帧驭 MotionHarness 视觉语言下的 Canvas kinetic 标题重制示例，实时调节字重、字距与节奏。">
<title>帧驭 MotionHarness · Canvas 示例</title>
<style>
:root{--bg:#17181a;--void:#121315;--plane:#1d1e21;--raised:#25262a;--ink:#e8e8e6;--ink2:#a5a6aa;--dim:#7f8085;--accent:#ff6a1a;--hot:#ff8a3d;--ok:#4fd18b;--mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;--ui:system-ui,"PingFang SC","Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui)}a{color:inherit;text-decoration:none}a:hover{color:var(--hot)}button,input{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--hot);outline-offset:5px}button:active{transform:translateY(1px)}.top{height:76px;padding:0 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--raised)}.back{font-size:13px;color:var(--ink2);min-height:44px;display:flex;align-items:center}.brand{font-weight:650;letter-spacing:-.03em}.brand em{font:12px var(--mono);color:var(--ink2);font-style:normal;margin-left:16px}.source{font-size:13px;color:var(--ink2)}main{max-width:1540px;margin:auto;padding:34px 40px 0}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.intro h1{font-size:18px;font-weight:500;margin:0;letter-spacing:-.03em}.intro p{margin:0;color:var(--ink2);font-size:12px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 272px;gap:28px}.preview{min-width:0;background:var(--void)}.stage{position:relative;height:448px;min-width:0;overflow:hidden}canvas{display:block;width:100%;height:100%}.sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.stage-note{position:absolute;top:24px;left:28px;color:var(--dim);font:11px var(--mono);pointer-events:none}.stage-note span{color:var(--accent)}.stage-foot{position:absolute;bottom:24px;left:28px;right:28px;display:flex;justify-content:space-between;color:var(--dim);font:11px var(--mono);pointer-events:none}.transport{height:68px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--raised);padding:0 20px;gap:12px}.phases{display:flex;gap:4px}.phases button{background:none;border:0;padding:10px;color:var(--dim);font-size:12px;min-height:44px}.phases button[aria-current=true]{color:var(--ink)}.phases button[aria-current=true]::before{content:"";display:inline-block;background:var(--accent);width:5px;height:5px;vertical-align:middle;margin-right:8px}.playback{display:flex;gap:8px}.playback button{font-size:12px;min-height:40px;min-width:54px;padding:8px 12px;border:1px solid #36373c;border-radius:4px;background:var(--plane)}.playback button:hover{background:var(--raised)}.timeline{height:2px;background:var(--raised)}.timeline i{display:block;height:100%;width:0;background:var(--accent)}aside{padding:4px 0 0}aside h2{font-weight:550;font-size:16px;margin:0 0 4px}aside>p{color:var(--ink2);font-size:12px;margin:0 0 26px}.control{margin:0 0 21px}.control label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2)}output{color:var(--ink);font:12px var(--mono)}input[type=range]{appearance:none;-webkit-appearance:none;width:100%;height:28px;margin:8px 0 0;background:transparent;cursor:ew-resize;accent-color:var(--accent)}input[type=range]::-webkit-slider-runnable-track{height:2px;background:#414247}input[type=range]::-webkit-slider-thumb{appearance:none;-webkit-appearance:none;width:12px;height:18px;background:var(--ink);border-radius:2px;margin-top:-8px;border:0}input[type=range]::-moz-range-track{height:2px;background:#414247}input[type=range]::-moz-range-thumb{width:12px;height:18px;background:var(--ink);border:0;border-radius:2px}.swatches{display:flex;gap:8px;margin:14px 0 22px}.swatch{display:flex;gap:8px;align-items:center;justify-content:center;flex:1;min-height:44px;background:none;border:1px solid #414247;border-radius:4px;color:var(--ink2);font:11px var(--mono)}.swatch i{width:12px;height:12px;border-radius:2px;background:var(--color)}.swatch[aria-pressed=true]{border-color:var(--accent);color:var(--ink)}.reset{width:100%;min-height:44px;border:1px solid #414247;background:none;border-radius:4px;font-size:12px;color:var(--ink2)}.reset:hover{color:var(--ink);background:var(--raised)}footer{display:flex;justify-content:space-between;gap:30px;align-items:center;padding:26px 0 24px;color:var(--dim);font-size:11px}footer p{margin:0;max-width:460px}footer a{color:var(--ink2)}.commands{display:flex;gap:20px;flex-wrap:wrap}code{font:11px var(--mono);color:var(--ink2)}noscript{display:block;padding:20px;color:var(--hot)}
@media(min-width:1450px){.stage{height:520px}}
@media(max-width:900px){.top{padding:0 24px}main{padding:28px 24px 0}.workspace{grid-template-columns:minmax(0,1fr) 230px;gap:20px}.brand em{display:none}.intro p{display:none}.stage{height:440px}.phases button{padding:8px}.transport{padding:0 12px}.playback{gap:4px}.playback button{padding:7px;min-width:44px}.commands{gap:10px}}
@media(max-width:700px){.top{height:64px;padding:0 20px}.brand{font-size:13px}.source{font-size:12px}main{padding:24px 16px 0}.intro{margin:0 4px 18px}.intro h1{font-size:16px}.workspace{display:block}.stage{height:360px}.stage-note{left:22px;top:22px;font-size:10px}.stage-foot{left:22px;right:22px;bottom:22px;font-size:10px}.transport{padding:0 10px;height:64px}.phases{gap:0}.phases button{font-size:11px;padding:6px;min-width:45px}.phases button[aria-current=true]::before{margin-right:4px;width:4px;height:4px}.playback button{font-size:11px;min-height:40px}.workspace aside{padding:28px 4px 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}aside h2,aside>p{grid-column:1/-1}aside>p{margin-bottom:16px}.control{margin-bottom:14px}.palette{grid-column:1/-1}.swatches{margin:10px 0 8px}.reset{grid-column:1/-1}footer{padding:26px 4px 30px;display:block}footer p{margin-bottom:14px}.commands{display:block}code{display:block;margin:6px 0}.palette .control{margin-bottom:0}}
</style>
</head>
<body>
<header class="top"><a class="back" href="index.html">← 示例集</a><div class="brand">帧驭 MotionHarness <em>Canvas study</em></div><a class="source" href="https://motionharness.top" target="_blank" rel="noopener noreferrer">产品官网 ↗</a></header>
<main>
<div class="intro"><h1>代码给出动势，你决定节奏。</h1><p>Canvas 2D / 实时参数</p></div>
<div class="workspace">
<section class="preview" aria-label="实时字效预览">
<div class="stage"><div class="stage-note"><span>●</span> LIVE CANVAS</div><canvas id="canvas" role="img" aria-label="帧驭 MotionHarness。Agent 写代码，人调参数。Horsepower by AI, Direction by you。万千动态 由你导演。"></canvas><div class="stage-foot"><span id="phaseName">标识 / 运动收束</span><span id="clock">0.00 s</span></div></div>
<div class="timeline" aria-hidden="true"><i id="progress"></i></div>
<div class="transport"><div class="phases" aria-label="选择动画段落"><button data-phase="0" aria-current="true">标识</button><button data-phase="1" aria-current="false">协作</button><button data-phase="2" aria-current="false">导演</button></div><div class="playback"><button id="pause" type="button">暂停</button><button id="replay" type="button">重播 ↺</button></div></div>
</section>
<aside aria-label="动画参数"><h2>你来调参</h2><p>拖动即生效，不必重新生成。</p>
<div class="control"><label for="speed">播放速度 <output id="speedValue">1.00×</output></label><input id="speed" type="range" min="0.5" max="1.8" step="0.05" value="1"></div>
<div class="control"><label for="weight">字重 <output id="weightValue">750</output></label><input id="weight" type="range" min="400" max="900" step="50" value="750"></div>
<div class="control"><label for="tracking">字距 <output id="trackingValue">0 px</output></label><input id="tracking" type="range" min="-2" max="6" step="0.5" value="0"></div>
<div class="control"><label for="impulse">入场冲量 <output id="impulseValue">0.65</output></label><input id="impulse" type="range" min="0" max="1" step="0.05" value="0.65"></div>
<div class="palette"><div class="control"><label>强调色 <output id="accentValue">#ff6a1a</output></label></div><div class="swatches" aria-label="强调色选择"><button class="swatch" data-color="#ff6a1a" aria-pressed="true" style="--color:#ff6a1a"><i></i>Orange</button><button class="swatch" data-color="#ff8a3d" aria-pressed="false" style="--color:#ff8a3d"><i></i>Hot</button></div></div>
<button class="reset" id="reset" type="button">恢复默认参数</button>
</aside>
</div>
<footer><p>基于 <a href="https://motionharness.top" target="_blank" rel="noopener noreferrer">帧驭 MotionHarness</a> 视觉语言重制的 Canvas 示例。<br>非官方 Studio 运行时。</p><div class="commands"><code>npm i -g @motionharness/cli</code><code>mh skill</code></div></footer>
<noscript>请启用 JavaScript，体验 Canvas 字效与实时调参。</noscript>
</main>
<script>
(() => {
'use strict';
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
if (!ctx) { canvas.outerHTML='<p style="padding:32px">此浏览器无法使用 Canvas 2D，请换用支持 Canvas 的浏览器。</p>'; return; }
const $ = id => document.getElementById(id);
const ui='system-ui,"PingFang SC","Noto Sans SC",sans-serif';
const mono='"SF Mono",ui-monospace,Menlo,Consolas,monospace';
const state={speed:1,weight:750,tracking:0,impulse:.65,accent:'#ff6a1a',time:0,paused:matchMedia('(prefers-reduced-motion: reduce)').matches};
let W=0,H=0,last=0,raf=0,phaseUI=-1;
const clamp=t=>Math.max(0,Math.min(1,t));
const ease=t=>{t=clamp(t);return 1-Math.pow(1-t,4)};
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);draw();}
function measure(text,size,weight=state.weight,spacing=state.tracking){ctx.font=`${weight} ${size}px ${ui}`;return [...text].reduce((sum,c)=>sum+ctx.measureText(c).width,0)+Math.max(0,[...text].length-1)*spacing;}
function fit(text,size,max){return measure(text,size)>max?size*Math.max(.1,(max-state.tracking*([...text].length-1)) / (measure(text,size)-state.tracking*([...text].length-1))):size;}
function line(text,x,y,size,local,delay,color,weight=state.weight,spacing=state.tracking){
 ctx.save();ctx.beginPath();ctx.rect(x-18,y-size*1.14,W-x+18,size*1.4);ctx.clip();
 ctx.font=`${weight} ${size}px ${ui}`;ctx.textBaseline='alphabetic';ctx.fillStyle=color;
 let pos=x;[...text].forEach((c,i)=>{const t=ease((local-delay-i*.018)/.72);const remain=1-t;ctx.save();ctx.globalAlpha=clamp(t*3);ctx.translate(pos+remain*(18+state.impulse*50),y+remain*(size*.96));ctx.transform(1,0,-remain*.16*state.impulse,1+remain*.15,0,0);ctx.fillText(c,0,0);ctx.restore();pos+=ctx.measureText(c).width+spacing;});ctx.restore();
}
function draw(){
 if(!W||!H)return;
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#121315';ctx.fillRect(0,0,W,H);
 const phase=Math.floor(state.time/2.8)%3,local=state.paused&&state.time===0?1.8:state.time%2.8;
 const p=W<450?24:Math.min(64,W*.07),max=W-p*2;
 // A short trailing wipe keeps adjacent phrases from ever overlapping.
 const exit=1-smooth((local-2.55)/.25);
 ctx.save();ctx.globalAlpha=exit;ctx.translate(-(1-exit)*24,0);
 const small=W<450;const y=H*(small?.40:.40);
 const cn=Math.min(small?59:92,max/4.3);const latin=fit('MotionHarness',Math.min(88,W*.088),max);
 if(phase===0){
  line('帧驭',p,y,cn,local,0,'#e8e8e6');
  line('MotionHarness',p,y+latin*1.12,latin,local,.10,'#e8e8e6');
  const yy=y+latin*1.12+(small?42:48);
  line('Agent 写代码，人调参数',p,yy,fit('Agent 写代码，人调参数',small?16:20,max),local,.42,'#a5a6aa',450,0);
 }else if(phase===1){
  const s=fit('Agent 写代码',small?39:65,max);
  line('Agent 写代码',p,y,s,local,0,'#e8e8e6');
  line('人调参数',p,y+s*1.25,s,local,.18,state.accent);
  line('帧驭 MotionHarness',p,y+s*1.25+(small?38:45),small?14:17,local,.40,'#a5a6aa',450,0);
 }else{
  const s=fit('万千动态',small?53:78,max);
  line('万千动态',p,y,s,local,0,'#e8e8e6');
  line('由你导演',p,y+s*1.2,s,local,.16,state.accent);
  line('帧驭 MotionHarness',p,y+s*1.2+(small?38:45),small?14:17,local,.40,'#a5a6aa',450,0);
 }
 const english='Horsepower by AI, Direction by you';const fs=Math.min(small?10.2:12,max/24);
 line(english,p,H-62,fs,local,.65,'#a5a6aa',400,0);
 // The accent rule grows into alignment, then a small directional cut travels once.
 const rule=32+ease(local/.7)*(max-32);ctx.fillStyle=state.accent;ctx.fillRect(p,H-88,rule,2);
 const cut=clamp((local-.7)/1.6)*max;ctx.fillStyle='#121315';ctx.fillRect(p+cut,H-89,Math.min(30,max-cut),4);
 ctx.restore();
 $('clock').textContent=state.time.toFixed(2)+' s';$('progress').style.width=(state.time/8.4*100)+'%';
 if(phase!==phaseUI){phaseUI=phase;$('phaseName').textContent=['标识 / 运动收束','协作 / 代码与方向','导演 / 万千动态'][phase];document.querySelectorAll('[data-phase]').forEach(b=>b.setAttribute('aria-current',Number(b.dataset.phase)===phase?'true':'false'));}
 canvas.dataset.phase=phase;canvas.dataset.time=state.time.toFixed(3);
}
function updatePause(){ $('pause').textContent=state.paused?'播放':'暂停';$('pause').setAttribute('aria-pressed',String(state.paused)); }
function frame(now){if(last&&!state.paused&&!document.hidden)state.time=(state.time+Math.min((now-last)/1000,.05)*state.speed)%8.4;last=now;draw();raf=requestAnimationFrame(frame);}
const settings={speed:v=>v.toFixed(2)+'×',weight:v=>v.toFixed(0),tracking:v=>v.toFixed(v%1?1:0)+' px',impulse:v=>v.toFixed(2)};
Object.keys(settings).forEach(id=>$(id).addEventListener('input',e=>{state[id]=Number(e.target.value);$(id+'Value').textContent=settings[id](state[id]);draw();}));
document.querySelectorAll('[data-color]').forEach(b=>b.addEventListener('click',()=>{state.accent=b.dataset.color;document.documentElement.style.setProperty('--accent',state.accent);$('accentValue').textContent=state.accent;document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));draw();}));
$('pause').addEventListener('click',()=>{state.paused=!state.paused;updatePause();draw();});
$('replay').addEventListener('click',()=>{state.time=0;state.paused=false;last=0;updatePause();draw();});
document.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>{state.time=Number(b.dataset.phase)*2.8+(state.paused?1.5:0);draw();}));
$('reset').addEventListener('click',()=>{Object.assign(state,{speed:1,weight:750,tracking:0,impulse:.65,accent:'#ff6a1a'});Object.keys(settings).forEach(id=>{$(id).value=state[id];$(id+'Value').textContent=settings[id](state[id]);});document.querySelector('[data-color="#ff6a1a"]').click();draw();});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches){state.paused=true;state.time=0;updatePause();draw();}});
new ResizeObserver(resize).observe(canvas);document.addEventListener('visibilitychange',()=>{last=0;});window.addEventListener('pagehide',()=>cancelAnimationFrame(raf),{once:true});updatePause();resize();raf=requestAnimationFrame(frame);
window.motionDemo={getState:()=>({...state}),renderAt:t=>{state.time=Math.max(0,t)%8.4;state.paused=true;updatePause();draw();}};
})();
</script>
</body></html>
